components:
  securitySchemes:
    OwnerSession:
      type: apiKey
      in: cookie
      name: fns_session
      description: Server-issued signed/opaque session cookie, HttpOnly/Secure/SameSite. On writes also require
        X-CSRF-Token; never put tokens in query strings.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code: *id001
        message: *id001
        retryable:
          type: boolean
        request_id: *id001
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
      - request_id
    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        commit: *id001
        environment: *id001
      required:
      - status
      - commit
      - environment
    Status:
      type: object
      additionalProperties: false
